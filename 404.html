    .panel { width: min(100%, 650px); padding: clamp(2rem, 6vw, 4.5rem); text-align: center; background: rgba(21,21,25,.88); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 28px 70px rgba(0,0,0,.35); }
    .eyebrow { margin: 0 0 1rem; color: var(--blue); font-size: .78rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font-family: 'Bebas Neue', sans-serif; font-size: clamp(4.5rem, 16vw, 9rem); font-weight: 400; letter-spacing: .04em; line-height: .82; color: var(--gold); }
    h2 { margin: 1.4rem 0 .85rem; font-size: clamp(1.45rem, 4vw, 2.15rem); line-height: 1.15; }
    p { max-width: 31rem; margin: 0 auto; color: var(--text); font-size: 1.02rem; line-height: 1.7; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: .8rem; margin-top: 2rem; }
    .button { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: .78rem 1.25rem; border-radius: 8px; font-weight: 700; text-decoration: none; transition: transform .2s ease, background .2s ease, border-color .2s ease; }
    .button:hover { transform: translateY(-2px); }
    .primary { color: var(--bg); background: var(--gold); }
    .primary:hover { background: var(--gold-soft); }
    .secondary { color: var(--white); border: 1px solid var(--border); background: transparent; }
    .secondary:hover { border-color: var(--muted); }
    a:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
    @media (max-width: 480px) { .nav { padding-left: 1rem; padding-right: 1rem; } .brand { font-size: 1rem; letter-spacing: .2em; } .nav-link { font-size: .83rem; } .panel { padding: 2.5rem 1.25rem; } }
