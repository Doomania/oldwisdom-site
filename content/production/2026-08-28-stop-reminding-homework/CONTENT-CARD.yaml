territory: "Independence / responsibility / helping too much"
canonical_publish_territory: confidence
stage: RELEASE
test_angle: LONG_TERM_CAPABILITY
parent_observation: "A parent has reminded their son about an assignment several times; he still has not started, and the deadline is close."
automatic_parent_interpretation: "If I stop reminding him, he will fail because he does not care or cannot manage it."
possible_teen_perspective: "He may already know, may be avoiding a task that feels too large, may lack a workable system, or may be relying on the parent to carry the alerting job. The article must not decide which without evidence."
parent_intent: "Prevent a missed deadline and protect future options."
possible_parent_impact: "Repeated unplanned reminders can turn homework into the parent's monitoring job, invite defensiveness, and make the next step less visibly the teenager's."
short_term_goal: "Know what is due and make a proportionate plan before the deadline."
long_term_capability: "Notice obligations, choose a planning system, seek help early, and recover from a manageable miss without a parent carrying the whole process."
core_belief_shift:
  from: "If I stop reminding my teenager about homework, I am being careless and setting him up to fail."
  to: "I can provide structure, agree one check-in, and step back from repeated chasing while my teenager carries the plan, the teacher contact, and the ordinary consequence."
practical_parent_move: "Use the Ownership Handoff: agree the conditions, stop daily chasing, and hold one calm weekly evidence review of the system—not a review of the teen’s character."
boundary_or_authority_note: "School attendance, access needs, sleep, wellbeing and agreed family conditions remain adult responsibilities. Re-enter temporarily for a pattern of missed or unknown work, an unworkable skill/access route, or distress/attendance/safeguarding concerns."
ownership_transfer: "The parent owns conditions and a weekly review; the teen records tasks, chooses the work order, checks school information, contacts teachers about routine questions, and carries ordinary school consequences."
