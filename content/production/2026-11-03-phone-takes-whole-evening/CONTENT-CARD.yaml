parent_observation: "After dinner, the phone stays out; homework, chores, or bedtime slide, and the parent and teen argue about taking it away."
automatic_parent_interpretation: "If I do not confiscate the phone, nothing will change."
possible_teen_perspective: "The teen might be unwinding, keeping a social commitment, struggling to start another task, or wishing the evening went differently. Ask rather than assume."
parent_intent: "Protect sleep and necessary family or school obligations without nightly conflict."
possible_parent_impact: "Confiscation as the only response may make the evening an argument about control instead of a chance to practise an evening plan; this is a possibility, not a demonstrated outcome."
short_term_goal: "Agree on one feasible start after dinner and keep explicit adult-owned sleep, safety, and shared-space limits."
long_term_capability: "The teen chooses, starts, and adjusts an evening routine while the parent keeps appropriate boundaries."
core_belief_shift:
  from: "If I do not take the phone away each night, nothing will change."
  to: "We can try a teen-designed start to the evening and review it weekly while I keep necessary sleep and safety limits."
practical_parent_move: "At a calm time, ask the teen to propose the first half-hour after dinner, including when online contact matters; agree a short weekly review instead of arguing each night."
boundary_or_authority_note: "The adult retains sleep, safety, and shared-household rules and models them; revisit support if sleep, attendance, distress, or access problems appear. No blanket promise that confiscation is never appropriate."
ownership_transfer: "The teen designs and tries the evening start and reports what worked or got in the way; the adult sets and enforces appropriate safety and household boundaries."
