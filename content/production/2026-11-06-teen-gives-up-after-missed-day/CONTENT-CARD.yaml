teen_outcomes: [judgment, ownership, independence]
parent_observation: "After missing one planned practice or personal habit, a teen says, 'I already ruined it' and wants to stop the whole plan."
automatic_parent_interpretation: "Missing a day proves they were never serious."
possible_teen_perspective: "They may feel that one imperfect day makes the effort pointless; or the plan may have been too demanding, the day crowded with family duties, or the goal no longer theirs. Ask rather than assume."
parent_intent: "Help the teen keep a meaningful commitment without ignoring the lapse."
possible_parent_impact: "A character verdict could add shame to the moment; a neutral question can make room for a restart, but no parental reaction determines the outcome."
short_term_goal: "Name what was missed, ask one calm question, and help the teen choose a feasible next chance without erasing real obligations."
long_term_capability: "The teen learns to decide whether and how to resume, change, or responsibly close a plan after a setback."
core_belief_shift:
  from: "One missed day proves my teen was not serious about the habit."
  to: "A lapse is information, not a character verdict; my reaction can make room for the teen to choose a realistic restart."
practical_parent_move: "Ask one neutral question about the next feasible chance; let the teen name what, when, and what to do if the barrier returns."
boundary_or_authority_note: "A missed personal habit differs from work promised to another person. Keep school, family, safety and team duties and applicable consequences; help address the affected person and use the reliability-signal guide for that distinct job."
ownership_transfer: "The teen chooses a restart, adjustment or honest stop for a personal goal, while the adult keeps non-negotiable household, school and safety boundaries."
